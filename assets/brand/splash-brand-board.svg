>Terracotta</text><text x="1260" y="1342" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="13" font-weight="400" letter-spacing="1" fill="#655c52">#B4542D</text><path d="M64 1380H1536" stroke="#d8d1c8"/><text x="64" y="1426" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="12" font-weight="600" letter-spacing="1.2" fill="#b4542d">04</text><text x="96" y="1426" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="12" font-weight="500" letter-spacing="1.5" fill="#655c52">TYPOGRAPHY</text><text x="64" y="1492" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="52" font-weight="600" letter-spacing="-1.3" fill="#221d17">Splash</text><text x="64" y="1530" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" letter-spacing="0" fill="#655c52">System sans / Semibold / −0.025em tracking</text><text x="64" y="1578" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="25" font-weight="500" letter-spacing="-0.4" fill="#221d17">Browse with a sense of direction.</text><text x="64" y="1614" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="17" font-weight="400" letter-spacing="0" fill="#655c52">Workspaces, trails, branches and pages.</text><text x="880" y="1426" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="12" font-weight="600" letter-spacing="1.2" fill="#b4542d">05</text><text x="912" y="1426" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="12" font-weight="500" letter-spacing="1.5" fill="#655c52">SMALL-SIZE RECOGNITION</text><g transform="translate(888 1514.0) scale(0.5)"><path fill="#221d17" d="M25 4H13a9 9 0 0 0 0 18h6a1 1 0 0 1 0 2H7v5h12a6 6 0 0 0 0-12h-6a4 4 0 0 1 0-8h12Z"/></g><text x="888" y="1590" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#655c52">16px</text><g transform="translate(976 1510.0) scale(0.75)"><path fill="#221d17" d="M25 4H13a9 9 0 0 0 0 18h6a1 1 0 0 1 0 2H7v5h12a6 6 0 0 0 0-12h-6a4 4 0 0 1 0-8h12Z"/></g><text x="976" y="1590" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#655c52">24px</text><g transform="translate(1080 1506.0) scale(1.0)"><path fill="#221d17" d="M25 4H13a9 9 0 0 0 0 18h6a1 1 0 0 1 0 2H7v5h12a6 6 0 0 0 0-12h-6a4 4 0 0 1 0-8h12Z"/></g><text x="1080" y="1590" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#655c52">32px</text><g transform="translate(1200 1498.0) scale(1.5)"><path fill="#221d17" d="M25 4H13a9 9 0 0 0 0 18h6a1 1 0 0 1 0 2H7v5h12a6 6 0 0 0 0-12h-6a4 4 0 0 1 0-8h12Z"/></g><text x="1200" y="1590" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#655c52">48px</text><g transform="translate(1344 1490.0) scale(2.0)"><path fill="#221d17" d="M25 4H13a9 9 0 0 0 0 18h6a1 1 0 0 1 0 2H7v5h12a6 6 0 0 0 0-12h-6a4 4 0 0 1 0-8h12Z"/></g><text x="1344" y="1590" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="13" font-weight="400" letter-spacing="0" fill="#655c52">64px</text><text x="880" y="1630" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" letter-spacing="0" fill="#655c52">Use the mark alone at 16px. Keep counters open.</text><path d="M64 1680H1536" stroke="#d8d1c8"/><text x="64" y="1726" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="12" font-weight="600" letter-spacing="1.2" fill="#b4542d">06</text><text x="96" y="1726" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="12" font-weight="500" letter-spacing="1.5" fill="#655c52">CONSTRUCTION &amp; USE</text><rect x="64" y="1760" width="128" height="128" fill="none" stroke="#b4542d" stroke-dasharray="4 4"/><g transform="translate(84 1780) scale(2.75)"><path fill="#221d17" d="M25 4H13a9 9 0 0 0 0 18h6a1 1 0 0 1 0 2H7v5h12a6 6 0 0 0 0-12h-6a4 4 0 0 1 0-8h12Z"/></g><text x="224" y="1790" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="20" font-weight="500" letter-spacing="0" fill="#221d17">Give the mark room.</text><text x="224" y="1820" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" letter-spacing="0" fill="#655c52">Minimum clear space: one stem width.</text><text x="224" y="1846" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" letter-spacing="0" fill="#655c52">Preserve proportions and original geometry.</text><text x="880" y="1790" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="20" font-weight="500" letter-spacing="0" fill="#221d17">Quiet by design.</text><text x="880" y="1820" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" letter-spacing="0" fill="#655c52">Flat color. Crisp silhouettes. No ornamental effects.</text><text x="880" y="1846" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="15" font-weight="400" letter-spacing="0" fill="#655c52">Accent for identity; monochrome within browser chrome.</text><text x="64" y="1928" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="600" letter-spacing="1.5" fill="#655c52">SPLASH</text><text x="1170" y="1928" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="500" letter-spacing="1" fill="#655c52">BRAND BOARD / OCTOBER 2026</text></svg>
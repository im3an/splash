ple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="12" font-weight="500" letter-spacing="1.5" fill="#655c52">SIGNATURE</text><rect x="64" y="500" width="720" height="260" rx="16" fill="#faf8f5"/><g transform="translate(235 587) scale(2.25)"><path fill="#221d17" d="M25 4H13a9 9 0 0 0 0 18h6a1 1 0 0 1 0 2H7v5h12a6 6 0 0 0 0-12h-6a4 4 0 0 1 0-8h12Z"/></g><text x="331.0" y="642.44" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="64.8" font-weight="600" letter-spacing="-1.62" fill="#221d17">Splash</text><rect x="808" y="500" width="728" height="260" rx="16" fill="#222224"/><g transform="translate(983 587) scale(2.25)"><path fill="#faf8f5" d="M25 4H13a9 9 0 0 0 0 18h6a1 1 0 0 1 0 2H7v5h12a6 6 0 0 0 0-12h-6a4 4 0 0 1 0-8h12Z"/></g><text x="1079.0" y="642.44" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="64.8" font-weight="600" letter-spacing="-1.62" fill="#faf8f5">Splash</text><text x="88" y="738" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="500" letter-spacing="1.1" fill="#655c52">PRIMARY / INK ON PAPER</text><text x="832" y="738" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="500" letter-spacing="1.1" fill="#a2a2a8">REVERSED / PAPER ON GRAPHITE</text><text x="64" y="814" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="12" font-weight="600" letter-spacing="1.2" fill="#b4542d">02</text><text x="96" y="814" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="12" font-weight="500" letter-spacing="1.5" fill="#655c52">LOGO FAMILY</text><rect x="64" y="840" width="472" height="260" rx="16" fill="#faf8f5"/><g transform="translate(244 894) scale(3.5)"><path fill="#221d17" d="M25 4H13a9 9 0 0 0 0 18h6a1 1 0 0 1 0 2H7v5h12a6 6 0 0 0 0-12h-6a4 4 0 0 1 0-8h12Z"/></g><text x="88" y="1076" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="500" letter-spacing="1.1" fill="#655c52">MONOCHROME</text><rect x="560" y="840" width="472" height="260" rx="16" fill="#e9e1d7"/><g transform="translate(740 894) scale(3.5)"><path fill="#b4542d" d="M25 4H13a9 9 0 0 0 0 18h6a1 1 0 0 1 0 2H7v5h12a6 6 0 0 0 0-12h-6a4 4 0 0 1 0-8h12Z"/></g><text x="584" y="1076" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="500" letter-spacing="1.1" fill="#655c52">TERRACOTTA</text><rect x="1056" y="840" width="480" height="260" rx="16" fill="#222224"/><g transform="translate(1190 858) scale(0.20703125)"><rect x="100" y="100" width="824" height="824" rx="184" fill="#f3efe9"/><g transform="translate(192 176) scale(20)"><path fill="#b4542d" d="M25 4H13a9 9 0 0 0 0 18h6a1 1 0 0 1 0 2H7v5h12a6 6 0 0 0 0-12h-6a4 4 0 0 1 0-8h12Z"/></g></g><text x="1080" y="1076" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="11" font-weight="500" letter-spacing="1.1" fill="#a2a2a8">MACOS APPLICATION ICON</text><text x="64" y="1154" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="12" font-weight="600" letter-spacing="1.2" fill="#b4542d">03</text><text x="96" y="1154" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="12" font-weight="500" letter-spacing="1.5" fill="#655c52">COLOR PALETTE</text><rect x="64" y="1180" width="276" height="104" rx="10" fill="#f3efe9"/><rect x="64" y="1180" width="276" height="104" rx="10" fill="none" stroke="#d8d1c8" stroke-width="1"/><text x="64" y="1315" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="18" font-weight="500" letter-spacing="0" fill="#221d17">Paper</text><text x="64" y="1342" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif" font-size="13" font-weight="400" letter-